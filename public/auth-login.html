<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Decap CMS login</title>
    <style>body{font-family:system-ui,Arial;margin:2rem}</style>
  </head>
  <body>
    <h2>Decap CMS token login</h2>
    <p>Fill your GitHub email and Personal Access Token (PAT). This page posts to a Firebase Function endpoint.</p>
    <form id="loginForm">
      <label>Email: <input name="email" type="email"></label><br><br>
      <label>Token: <input name="token" type="text" size="60"></label><br><br>
      <label>Admin password: <input name="password" type="password"></label><br><br>
      <button type="submit">Submit</button>
    </form>
    <pre id="out"></pre>

    <script>
    // When served from Firebase Hosting, this resolves to /api.
    // If you want to use another backend, replace this value.
    const FUNCTION_BASE_URL = window.FUNCTION_BASE_URL || '/api';
    const out = document.getElementById('out');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = { email: f.email.value, token: f.token.value, password: f.password.value };
      out.textContent = 'Sending...';
      try {
        const res = await fetch(FUNCTION_BASE_URL + '/save-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'Error: ' + err.message;
      }
    });
    </script>
  </body>
</html>

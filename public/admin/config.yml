                      - { label: "0°", value: 0 }
                      - { label: "90°", value: 90 }
                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }
              - { label: Innere Auge text, name: innereAugeText, widget: text }
              - label: Innere Auge images
                name: innereAugeImages

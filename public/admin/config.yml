                  - label: Rotation
                    name: rotation
                    widget: select
                    default: 0
                    options:
                      - { label: "0°", value: 0 }
                      - { label: "90°", value: 90 }
                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }

      - name: about
        label: About
        file: src/content/about.json
        format: json
        fields:
          - label: Portrait
            name: portrait
            widget: object
            fields:
              - { label: Image, name: src, widget: image, choose_url: true, required: false }

                    options:
                      - { label: "0°", value: 0 }
                      - { label: "90°", value: 90 }
                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }
              - { label: Alt title, name: titleAlt, widget: string }
              - label: Stills
                name: stills
                widget: list
                fields:
                  - { label: Image, name: src, widget: image, choose_url: true, required: false }
                  - label: Rotation
                    name: rotation
                    widget: select
                    default: 0
                    options:
                      - { label: "0°", value: 0 }
                      - { label: "90°", value: 90 }
                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }

      - name: birdland
        label: Birdland
        file: src/content/birdland.json
        format: json
        fields:
          - { label: Intro text, name: intro, widget: text }
          - { label: Browse hint, name: hint, widget: string }
          - label: Works
            name: works
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Folder slug, name: folder, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - label: Images
                name: images
                widget: list
                fields:
                  - { label: Image, name: src, widget: image, choose_url: true, required: false }
                  - label: Rotation
                    name: rotation
                    widget: select
                    default: 0
                    options:
                      - { label: "0°", value: 0 }
                      - { label: "90°", value: 90 }
                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }


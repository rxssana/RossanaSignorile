                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }
              - { label: Masks text, name: masksText, widget: text }
              - label: Masks image
                name: masksImage
                widget: object
                fields:
                  - { label: Image, name: src, widget: image, choose_url: true, required: false }
                  - label: Rotation
                    name: rotation
                    widget: select
                    default: 0
                    options:
                      - { label: "0°", value: 0 }
                      - { label: "90°", value: 90 }
                      - { label: "180°", value: 180 }
                      - { label: "270°", value: 270 }
              - label: Stills
                name: stills

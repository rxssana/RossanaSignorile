name: Deploy Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "firebase.json"
      - ".firebaserc"
      - "public/**"
      - "src/**"
      - "tools/firebase-decap/**"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Set FIREBASE_TOKEN and FIREBASE_PROJECT_ID repository secrets first." >&2
            exit 1
          fi
          firebase deploy --non-interactive --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --only hosting
